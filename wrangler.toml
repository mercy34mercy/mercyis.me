name = "mercy"

workers_dev = true
main = "worker/index.ts"
# https://developers.cloudflare.com/workers/platform/compatibility-dates
compatibility_date = "2023-04-03"

kv_namespaces = [
  { binding = "API_FETCH_KV", id = "76f58b96abcf4853ac57c3a59853a376", preview_id = "76f58b96abcf4853ac57c3a59853a376" }
]

[site]
  bucket = "./public"

[build]
  command = "npm run build:css && npm run build:remix"

[vars]
  TZ = "Asia/Tokyo"

[[ d1_databases ]]
binding = "DB" # i.e. available in your Worker on env.DB
database_name = "mercy-me"
database_id = "86297234-cd30-4186-8d5f-ac7ef9b0bbda"
