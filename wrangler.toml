name = "apple-yagi"

workers_dev = true
main = "worker/index.ts"
# https://developers.cloudflare.com/workers/platform/compatibility-dates
compatibility_date = "2022-04-05"

kv_namespaces = [
  { binding = "API_FETCH_KV", id = "d2cccb257de74447bff2696bb94b6038", preview_id = "5afab85b86c3427eacd92051c4467e43" }
]

[site]
  bucket = "./public"

[build]
  command = "npm run build:css && npm run build:remix"

[vars]
  TZ = "Asia/Tokyo"

[[ d1_databases ]]
binding = "DB" # i.e. available in your Worker on env.DB
database_name = "apple-yagi-me"
database_id = "9c815c67-3431-458b-beb4-512e6b91c62d"
